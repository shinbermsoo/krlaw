<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>판례찾기 - 법제처 판례 검색</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f6f8;--ink:#16213a;--mut:#5e6a80;--line:#d9dee7;--seal:#b3261e;--blue:#2a5bd7;--serif:'Noto Serif KR',serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 'Noto Sans KR',system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.seal{width:30px;height:30px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font:700 17px var(--serif)}
h1{font:700 19px var(--serif);margin:0;flex:1}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;min-height:42px;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.4;cursor:default}.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;background:#fff;min-width:0;width:100%}
form{padding:14px 16px;background:#fff;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row #q{flex:1 1 220px;width:auto;font-size:16px}.row select{width:auto}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);padding:4px 0}
.adv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.adv label{display:grid;gap:3px;font-size:13px;color:var(--mut)}
.wrap{display:grid;grid-template-columns:minmax(320px,400px) 1fr;gap:16px;padding:16px;max-width:1280px;margin:auto}
#st{color:var(--mut);margin:0 0 10px;scroll-margin-top:64px}.err{color:var(--seal)}.mut{color:var(--mut)}
.item{display:grid;gap:2px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.item b{font:600 15px/1.5 var(--serif)}.item span{font-size:13px;color:var(--mut)}
.item.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--seal)}
#pg{display:flex;gap:12px;align-items:center;justify-content:center;padding:8px 0}
#detail{background:#fff;border:1px solid var(--line);border-radius:10px;position:sticky;top:64px;height:calc(100dvh - 80px);overflow:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
#back{display:none}#db{padding:6px 20px 40px;max-width:760px}
#db h2{font:700 20px/1.5 var(--serif);margin:14px 0 2px}#db h3{font:700 15px var(--serif);margin:26px 0 6px}
.tx{font:16px/1.95 var(--serif);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
mark{background:#ffe9a8;color:inherit}
dialog{border:1px solid var(--line);border-radius:12px;max-width:440px;width:calc(100% - 32px)}
dialog label{display:grid;gap:4px;margin:10px 0;font-size:13px;color:var(--mut)}dialog p{font-size:13px;color:var(--mut)}
@media(max-width:899px){.wrap{grid-template-columns:1fr;padding:12px}
#detail{position:fixed;inset:0;z-index:20;height:auto;border:0;border-radius:0;transform:translateX(100%);visibility:hidden;transition:transform .2s,visibility .2s}
#detail.open{transform:none;visibility:visible}#back{display:inline-flex}.bar{padding-top:max(10px,env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){#detail{transition:none}}
</style></head><body>
<header><span class="seal">判</span><h1>판례찾기</h1><button class="btn" id="cfg" type="button">설정</button></header>
<form id="f"><div class="row">
<input id="q" type="search" placeholder="사건명·키워드 (예: 전세보증금 반환, 부당해고)" enterkeyhint="search" autocomplete="off">
<select id="scope" aria-label="검색 범위"><option value="1">판례명</option><option value="2">본문</option></select>
<button class="btn pri">검색</button></div>
<details><summary>상세 조건</summary><div class="adv">
<label>법원<select id="court"><option value="">전체</option><option value="400201">대법원</option><option value="400202">하급심</option></select></label>
<label>선고일 시작<input type="date" id="d1"></label><label>선고일 끝<input type="date" id="d2"></label>
<label>정렬<select id="sort"><option value="ddes">최신 선고순</option><option value="dasc">오래된 선고순</option></select></label>
<label>사건번호<input id="nb" placeholder="2018다1234"></label><label>참조법령<input id="jo" placeholder="민법"></label>
</div></details></form>
<div class="wrap"><section><p id="st">사건명 또는 본문 키워드로 법제처 판례를 검색합니다.</p><div id="res"></div><div id="pg"></div></section>
<aside id="detail"><div class="bar"><button class="btn" id="back" type="button">← 목록</button><button class="btn" id="cp" type="button">인용 복사</button><a class="btn" id="orig" target="_blank" rel="noopener">원문 보기</a></div>
<div id="db"><p class="mut">목록에서 판례를 선택하세요.</p></div></aside></div>
<dialog id="dlg"><form method="dialog"><h2 style="margin:0 0 4px;font:700 17px var(--serif)">설정</h2>
<label>법제처 OC 인증키<input id="oc" autocomplete="off" placeholder="신청 시 사용한 이메일 ID"></label>
<label>API 주소 (같은 사이트면 비워 둠)<input id="base" placeholder="https://내사이트.netlify.app"></label>
<p>서버에 환경변수 LAW_OC를 지정했다면 OC는 입력하지 않아도 됩니다. 이 브라우저에만 저장됩니다.</p>
<div class="row"><button class="btn pri" value="ok">저장</button><button class="btn" value="x">닫기</button></div></form></dialog>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let page=1,per=20,total=0,cur=null,kw=[];
const cfg=k=>localStorage.getItem(k)||'',mob=()=>matchMedia('(max-width:899px)').matches;
const st=(m,e)=>{const s=$('#st');s.textContent=m;s.className=e?'err':''};
async function api(p){const u=new URLSearchParams(p);if(cfg('oc'))u.set('oc',cfg('oc'));let j;
 try{j=await(await fetch(cfg('base').replace(/\/$/,'')+'/api/law?'+u)).json()}catch(e){throw Error('서버 응답을 받지 못했습니다. Netlify 함수 배포 여부를 확인하세요.')}
 if(j.error)throw Error(j.error+(j.hint?' ('+j.hint+')':''));return j}
const fd=s=>/^\d{8}$/.test(s||'')?`${+s.slice(0,4)}. ${+s.slice(4,6)}. ${+s.slice(6)}.`:(s||'');
const cite=p=>`${p.법원명||''} ${fd(p.선고일자)} 선고 ${p.사건번호||''} ${p.판결유형||'판결'}`.replace(/\s+/g,' ').trim();
const clean=s=>s?new DOMParser().parseFromString(String(s).replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n'),'text/html').body.textContent.trim():'';
const hl=t=>{let h=esc(t);if(kw.length)h=h.replace(new RegExp('('+kw.map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi'),'<mark>$1</mark>');return h};
async function search(n){page=n;const v=i=>$(i).value.trim(),q=v('#q');
 const p={action:'search',query:q,search:v('#scope'),display:per,page,sort:v('#sort')};
 if(v('#court'))p.org=v('#court');if(v('#nb'))p.nb=v('#nb');if(v('#jo'))p.JO=v('#jo');
 const a=v('#d1').replace(/-/g,''),b=v('#d2').replace(/-/g,'');
 if(a||b)p.prncYd=(a||'19000101')+'~'+(b||new Date().toISOString().slice(0,10).replace(/-/g,''));
 if(!q&&!p.nb&&!p.JO&&!p.org&&!p.prncYd)return st('검색어나 조건을 입력하세요.',1);
 kw=q.split(/\s+/).filter(Boolean);st('검색 중…');$('#res').innerHTML='';$('#pg').innerHTML='';
 try{const j=await api(p),s=j.PrecSearch;if(!s)return st(j.Law||j.result||j.msg||'결과가 없습니다.',1);
  total=+s.totalCnt||0;const L=[].concat(s.prec||[]);if(!L.length)return st('일치하는 판례가 없습니다.');
  const N=Math.ceil(total/per);st(`총 ${total.toLocaleString()}건 · ${page} / ${N} 쪽`);
  $('#res').innerHTML=L.map(x=>`<button class="item" data-id="${esc(x.판례일련번호)}"><b>${esc(x.사건명)}</b><span>${esc(x.법원명)} · ${esc(fd(x.선고일자))} · ${esc(x.사건번호)}</span><span>${esc(x.판결유형||'')}${x.데이터출처명?' · '+esc(x.데이터출처명):''}</span></button>`).join('');
  $('#pg').innerHTML=N>1?`<button class="btn" ${page<2?'disabled':''} data-p="${page-1}">이전</button><span>${page} / ${N}</span><button class="btn" ${page>=N?'disabled':''} data-p="${page+1}">다음</button>`:'';
  $('#st').scrollIntoView()}
 catch(e){st(e.message,1);if(/OC/.test(e.message))$('#dlg').showModal()}}
async function open(id){document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',e.dataset.id===id));
 if(mob()&&!$('#detail').classList.contains('open'))history.pushState({d:1},'');
 $('#detail').classList.add('open');$('#db').innerHTML='<p class="mut">불러오는 중…</p>';
 try{const j=await api({action:'detail',ID:id}),p=j.PrecService;if(!p)throw Error(j.result||j.msg||'판례 본문을 받지 못했습니다.');
  cur=p;const S=['판시사항','판결요지','참조조문','참조판례','판례내용'].map(k=>[k,clean(p[k])]).filter(x=>x[1]);
  $('#db').innerHTML=`<h2>${esc(p.사건명)}</h2><p class="mut">${esc(cite(p))}${p.사건종류명?' · '+esc(p.사건종류명):''}</p>`+(S.map(([k,t])=>`<h3>${k}</h3><div class="tx">${hl(t)}</div>`).join('')||'<p class="mut">본문이 제공되지 않는 판례입니다. 원문 보기를 이용하세요.</p>');
  $('#orig').href='https://www.law.go.kr/precInfoP.do?precSeq='+encodeURIComponent(id);$('#detail').scrollTop=0}
 catch(e){$('#db').innerHTML=`<p class="err">${esc(e.message)}</p>`}}
$('#f').onsubmit=e=>{e.preventDefault();search(1)};
$('#res').onclick=e=>{const b=e.target.closest('.item');if(b)open(b.dataset.id)};
$('#pg').onclick=e=>{const b=e.target.closest('[data-p]');if(b)search(+b.dataset.p)};
$('#back').onclick=()=>history.back();
addEventListener('popstate',()=>$('#detail').classList.remove('open'));
$('#cp').onclick=async()=>{if(!cur)return;try{await navigator.clipboard.writeText(cite(cur))}catch{const t=document.createElement('textarea');t.value=cite(cur);document.body.append(t);t.select();document.execCommand('copy');t.remove()}
 $('#cp').textContent='복사됨';setTimeout(()=>$('#cp').textContent='인용 복사',1200)};
$('#cfg').onclick=()=>{$('#oc').value=cfg('oc');$('#base').value=cfg('base');$('#dlg').showModal()};
$('#dlg').onclose=()=>{if($('#dlg').returnValue==='ok'){localStorage.setItem('oc',$('#oc').value.trim());localStorage.setItem('base',$('#base').value.trim())}};
addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}});
</script></body></html>
